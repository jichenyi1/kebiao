<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小包子课表 · C 果冻色卡 · 可交互原型</title>
<style>
  :root{
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#E7EBE2;font-family:var(--sans);color:#33261C;min-height:100vh;display:flex;align-items:center;justify-content:center;gap:40px;padding:36px;flex-wrap:wrap}
  .panel{max-width:270px}
  .panel h1{font-size:26px;font-weight:800}
  .panel p{font-size:12px;color:#5C4F41;margin-top:8px;line-height:1.7}
  .panel .hint{margin-top:14px;font-size:12px;color:#5C4F41;background:#fff;border:1px solid #E3D9C8;border-radius:14px;padding:12px 14px;line-height:1.7}
  .panel .hint b{color:#C2410C}
  .panel .row{display:flex;gap:8px;margin-top:14px}
  .panel button{font:inherit;font-size:12px;font-weight:700;border:1px solid #E3D9C8;background:#fff;color:#5C4F41;padding:8px 13px;border-radius:999px;cursor:pointer;transition:.15s}
  .panel button.act{background:#33261C;color:#fff;border-color:#33261C}
  .panel button:active{transform:scale(.94)}

  .device{width:312px;height:656px;border-radius:40px;background:#2B2119;padding:9px;box-shadow:0 18px 44px rgba(0,0,0,.20),0 0 0 1.5px #4A3A2A;flex:none;position:relative}
  .device::after{content:"";position:absolute;top:16px;left:50%;transform:translateX(-50%);width:80px;height:20px;background:#2B2119;border-radius:11px;z-index:40}
  .screen{width:100%;height:100%;border-radius:32px;overflow:hidden;display:flex;flex-direction:column;position:relative;
    --bg:#FDF3E3; --surf:#FFFFFF; --ink:#33261C; --mut:#7A6A5C; --line:#F0E4D3;
    --coral:#C2410C; --coral-soft:#FFE9D8; --green:#0B7440; --green-soft:#E4F5EC;
    --c-bg:#E7F0FF; --c-ink:#1957CC; --t-bg:#FFF3DC; --t-ink:#8A4B06;
    --m-bg:#E5F6EC; --m-ink:#0B7440; --f-bg:#F3EEE6;
    --dgr:#B3261E; --dgr-soft:#FDE3E3;
    --wk0a:#E7F0FF; --wk0b:#1957CC; --wk1a:#FFE4D6; --wk1b:#B44708; --wk2a:#DFF3EE; --wk2b:#0B7440;
    --wk3a:#EFE9FB; --wk3b:#6B4EBC; --wk4a:#FFF3D1; --wk4b:#8A6100; --wk5a:#FFE4EC; --wk5b:#C2185B;
    background:var(--bg); color:var(--ink)}
  .screen[data-theme="dark"]{
    --bg:#201913; --surf:#2B2119; --ink:#F3E9DC; --mut:#B8A48E; --line:#3A2E20;
    --coral:#FF8A4C; --coral-soft:#43220F; --green:#7FD1A0; --green-soft:#17301F;
    --c-bg:#1E2A45; --c-ink:#9DB8F5; --t-bg:#3A2C14; --t-ink:#F0C36B;
    --m-bg:#15301F; --m-ink:#7FD1A0; --f-bg:#332A20;
    --dgr:#FF8A80; --dgr-soft:#43201C;
    --wk0a:#1E2A45; --wk0b:#9DB8F5; --wk1a:#3A2318; --wk1b:#F5B79E; --wk2a:#12312A; --wk2b:#7FD1A0;
    --wk3a:#2B2340; --wk3b:#C9B8F0; --wk4a:#3A3115; --wk4b:#F0CE7A; --wk5a:#3B1E2B; --wk5b:#F5A8C0}

  .status{flex:none;height:36px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px 4px;font-size:12px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .view{flex:1;display:flex;flex-direction:column;overflow:hidden;animation:fadeup .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .home{flex:none;height:18px;display:flex;align-items:center;justify-content:center}
  .home i{width:110px;height:4px;border-radius:2px;background:var(--ink);opacity:.22}

  .ic{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:8px}

  /* 顶栏 */
  .top{flex:none;display:flex;align-items:flex-start;justify-content:space-between;padding:8px 16px 10px}
  .tb-t{font-size:19px;font-weight:800;display:flex;align-items:center;gap:7px}
  .bun{width:14px;height:12px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 50% 30%,#FFD9A8,#F4A261);position:relative;flex:none}
  .bun::after{content:"";position:absolute;left:50%;top:1px;transform:translateX(-50%);width:6px;height:4px;border-radius:50%;background:#E07B39}
  .tb-s{font-size:12px;color:var(--mut);margin-top:3px;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .tb-a{display:flex;align-items:center;gap:10px;padding-top:3px}
  .ib{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#8A5A2E;transition:.15s}
  .ib:active{transform:scale(.86);background:var(--coral-soft)}
  .pill{font-size:12px;font-weight:800;color:var(--coral);border:1.5px solid var(--coral);padding:4px 10px;border-radius:999px;font-family:var(--mono);font-variant-numeric:tabular-nums;cursor:pointer;transition:.15s;background:transparent}
  .pill:active{transform:scale(.93)}
  .pill.ghost{color:var(--mut);border-color:var(--line)}
  .backbtn{display:inline-flex;align-items:center;gap:4px;padding:7px 13px 7px 9px;border-radius:999px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);font-size:15px;font-weight:800;cursor:pointer;transition:.15s}
  .backbtn:active{transform:scale(.93);border-color:var(--coral);color:var(--coral)}
  .pgtitle{font-size:19px;font-weight:800;padding:2px 2px 10px}
  .back:active{transform:translateX(-2px)}

  .body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 14px 10px;scrollbar-width:none}
  .body::-webkit-scrollbar{display:none}

  /* 日期头 */
  .datehead{display:flex;align-items:flex-end;gap:9px;padding:2px 2px 12px}
  .datehead .d{font-size:26px;font-weight:800;color:var(--coral);line-height:1}
  .datehead .s{font-size:12px;color:var(--mut);padding-bottom:2px;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .datehead .nav{margin-left:auto;display:flex;gap:6px}
  .chev{width:30px;height:30px;border:1.5px solid var(--line);border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--mut);cursor:pointer;transition:.15s;background:var(--surf)}
  .chev:active{transform:scale(.86);border-color:var(--coral);color:var(--coral)}

  /* 果冻卡 */
  .jcard{border-radius:18px;padding:11px 13px;margin-bottom:10px;position:relative;cursor:pointer;
    transition:transform .14s cubic-bezier(.2,.8,.2,1),box-shadow .14s;will-change:transform}
  .jcard:active{transform:scale(.965)}
  .jcard.course{background:var(--c-bg)} .jcard.course .nm{color:var(--c-ink)}
  .jcard.todoj{background:var(--t-bg)} .jcard.todoj .nm{color:var(--t-ink)}
  .jcard.meal{background:var(--m-bg)} .jcard.meal .nm{color:var(--m-ink)}
  .jcard.free{background:var(--f-bg)}
  .krow{display:flex;align-items:center;gap:6px}
  .typ{font-size:12px;font-weight:800;color:var(--mut)}
  .sp{flex:1}
  .pill{font-size:12px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums;border-radius:999px;padding:2.5px 9px;background:var(--surf);color:var(--mut);animation:pop .22s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .pill.now{background:var(--coral);color:#fff}
  .pill.now i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:5px;vertical-align:1px}
  .pill.rg{background:var(--t-ink);color:var(--t-bg)}
  .pill.od{background:var(--dgr);color:#fff}
  .nm{font-size:15px;font-weight:800;margin-top:3px;line-height:1.3}
  .mt{font-size:12px;color:var(--mut);margin-top:3px;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.5}

  /* 分区标题 */
  .sec{display:flex;align-items:center;gap:6px;padding:10px 2px 6px;font-size:12px;font-weight:800;color:var(--coral)}
  .sec .n{font-family:var(--mono);color:var(--mut);font-weight:700}
  .sec .ln{flex:1;border-top:1.5px dashed var(--line)}

  /* 勾选框 */
  .cbx{width:21px;height:21px;border:2px solid #C9A87C;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;transition:.2s;cursor:pointer;background:transparent}
  .screen[data-theme="dark"] .cbx{border-color:#8A7355}
  .cbx svg{width:13px;height:13px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .28s ease .04s}
  .cbx.on{background:var(--green);border-color:var(--green);animation:cbxpop .28s cubic-bezier(.3,1.6,.5,1)}
  .cbx.on svg{stroke-dashoffset:0}
  @keyframes cbxpop{50%{transform:scale(1.22)}}

  /* 待办行（首页卡内 & 待办页） */
  .trow{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:14px;background:var(--surf);margin-bottom:8px;transition:transform .14s}
  .trow:active{transform:scale(.97)}
  .trow .tx{font-size:15px;font-weight:700;line-height:1.35;
    background:linear-gradient(currentColor,currentColor) left 55%/0% 2px no-repeat;transition:background-size .3s,color .25s}
  .trow.done .tx{background-size:100% 2px;color:var(--mut);font-weight:600}
  .trow .sub{font-size:12px;color:var(--mut);margin-top:3px;font-family:var(--mono);font-variant-numeric:tabular-nums;display:flex;gap:7px;flex-wrap:wrap}
  .trow .sub .od{color:var(--dgr);font-weight:800}
  .trow .del{color:var(--mut);font-size:15px;padding:2px 5px;cursor:pointer;border-radius:8px;transition:.15s;flex:none}
  .trow .del:active{transform:scale(.85);color:var(--dgr)}
  .etag{font-size:12px}

  /* chips */
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .chip{font-size:12px;font-weight:700;border:1.5px solid var(--line);background:var(--surf);border-radius:999px;padding:5px 11px;color:var(--mut);cursor:pointer;transition:.15s}
  .chip:active{transform:scale(.92)}
  .chip.on{color:var(--coral);border-color:var(--coral);background:var(--coral-soft)}

  /* seg */
  .seg{display:inline-flex;border:1.5px solid var(--line);border-radius:14px;padding:3px;background:var(--f-bg);gap:3px}
  .seg b{font-size:12px;font-weight:700;color:var(--mut);padding:6px 13px;border-radius:11px;cursor:pointer;transition:.18s}
  .seg b.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.07);animation:pop .2s}

  /* 底部导航 */
  .nav{flex:none;height:60px;display:flex;background:var(--surf);border-top:1.5px solid var(--line);position:relative}
  .nav .n{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--mut);cursor:pointer;position:relative;transition:color .18s}
  .nav .n .ic{transition:transform .22s cubic-bezier(.3,1.6,.5,1)}
  .nav .n.on{color:var(--coral)}
  .nav .n.on .ic{transform:translateY(-2px) scale(1.08)}
  .nav .n.on::after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3.5px;border-radius:0 0 4px 4px;background:var(--coral);animation:pop .25s}
  .nav .cnt{position:absolute;top:5px;left:calc(50% + 5px);min-width:16px;height:16px;border-radius:999px;background:var(--dgr);color:#fff;font-size:12px;font-weight:800;font-family:var(--mono);display:flex;align-items:center;justify-content:center;padding:0 4px}
  .fab{position:absolute;right:15px;bottom:76px;width:52px;height:52px;border-radius:17px;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(194,65,12,.35);z-index:8;cursor:pointer;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
  .fab:active{transform:scale(.86) rotate(8deg)}
  .fab .ic{width:25px;height:25px;stroke-width:2.4}

  /* 弹层 */
  .scrim{position:absolute;inset:0;background:rgba(30,20,10,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30;animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{background:var(--surf);border-radius:24px 24px 0 0;width:100%;padding:18px 18px 26px;animation:up .34s cubic-bezier(.3,1.35,.45,1)}
  @keyframes up{from{transform:translateY(60%);opacity:.4}to{transform:none;opacity:1}}
  .dlg-t{font-size:19px;font-weight:800}
  .dlg-b{font-size:12px;color:var(--mut);margin-top:7px;line-height:1.6}
  .dlg-a{display:flex;gap:10px;margin-top:16px}
  .dlg-a b{flex:1;text-align:center;font-size:15px;font-weight:800;padding:12px;border-radius:14px;cursor:pointer;transition:.15s}
  .dlg-a b:active{transform:scale(.95)}
  .dlg-a .g{color:var(--mut);border:1.5px solid var(--line)}
  .dlg-a .p{background:var(--coral);color:var(--surf)}
  .stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:14px 0 4px}
  .stepper .v{font-family:var(--mono);font-size:26px;font-weight:800;min-width:110px;text-align:center;font-variant-numeric:tabular-nums}
  .stepper .b{width:42px;height:42px;border:1.5px solid var(--line);border-radius:14px;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--coral);font-weight:800;transition:.15s;background:var(--surf)}
  .stepper .b:active{transform:scale(.88);background:var(--coral-soft)}

  /* 表单 */
  .fld{margin-bottom:13px}
  .flabel{font-size:12px;font-weight:800;color:var(--mut);margin-bottom:7px}
  .fin{width:100%;background:var(--surf);border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;font:inherit;font-size:15px;color:var(--ink);outline:0;transition:border-color .2s}
  .fin:focus{border-color:var(--coral)}
  .dotc{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:.15s}
  .dotc:active{transform:scale(.85)}
  .dotc.on{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--surf)}
  .btnrow{display:flex;gap:10px;margin-top:8px}
  .btn{flex:1;text-align:center;font-size:15px;font-weight:800;padding:13px;border-radius:16px;cursor:pointer;transition:.15s}
  .btn:active{transform:scale(.96)}
  .btn.pri{background:var(--coral);color:var(--surf)}
  .btn.del{color:var(--dgr);border:1.5px solid var(--dgr);flex:0 0 auto;padding:13px 18px}

  /* 整周 */
  .wk{flex:1;display:flex;flex-direction:column;padding:0 12px 6px;overflow:hidden;--colw:64px}
  .wkmain{flex:1;display:flex;gap:3px;min-height:0}
  .wktcol{flex:none;width:36px;display:grid;grid-template-rows:20px repeat(12,34px);gap:3px}
  .wktcol b{font-family:var(--mono);font-size:12px;color:var(--mut);text-align:right;align-self:start;font-variant-numeric:tabular-nums}
  .wkscroll{flex:1;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  .wkscroll::-webkit-scrollbar{display:none}
  .wkhead{display:grid;grid-template-columns:repeat(7,var(--colw));gap:3px;height:20px;margin-bottom:3px}
  .wkhead span{font-size:12px;font-weight:800;color:var(--mut);text-align:center;font-family:var(--mono)}
  .wkhead .t{color:var(--coral)}
  .wkgrid{display:grid;grid-template-columns:repeat(7,var(--colw));grid-auto-rows:34px;gap:3px}
  .cell{background:var(--f-bg);border-radius:10px;cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:center;position:relative}
  .cell .pl{font-size:14px;font-weight:700;color:var(--mut);opacity:.4}
  .cell:active{background:var(--coral-soft)}
  .cell:active .pl{color:var(--coral);opacity:1}
  .cell.tint{background:var(--coral-soft)}
  .wk.fit .cell .pl{display:none}
  .blk{position:relative;z-index:1;background:var(--surf);border:1.5px solid var(--line);border-radius:10px;padding:3px 4px 3px 13px;font-size:12px;font-weight:800;overflow:hidden;line-height:1.25;cursor:pointer;transition:transform .12s;box-shadow:0 1px 4px rgba(0,0,0,.07)}
  .blk:active{transform:scale(.94)}
  .blk::before{content:"";position:absolute;left:5px;top:6px;width:5px;height:5px;border-radius:50%}
  .blk small{display:block;font-weight:600;color:var(--mut);font-size:12px;margin-top:1px;font-family:var(--mono);transform-origin:left;font-variant-numeric:tabular-nums}
  .blk.red{background:var(--dgr-soft);border-color:var(--dgr)} .blk.red,.blk.red small{color:var(--dgr)} .blk.red::before{background:var(--dgr)}
  .blk.off{opacity:.45} .blk.off::before{background:var(--mut)}
  .wk.fit{--colw:1fr}
  .wk.fit .wktcol{grid-template-rows:20px repeat(12,24px)}
  .wk.fit .wkgrid{grid-auto-rows:24px}
  .wk.fit .blk{font-size:12px;padding:2px 3px 2px 10px}
  .wk.fit .blk::before{width:4px;height:4px;left:4px;top:5px}
  .wk.fit .blk small{font-size:12px;margin-top:0}

  /* 滚轮时间选择 */
  .wheelwrap{display:flex;gap:10px;justify-content:center;height:196px;position:relative;margin-top:10px}
  .wheelwrap::before{content:"";position:absolute;left:8px;right:8px;top:78px;height:40px;border-radius:12px;background:var(--coral-soft);z-index:0}
  .wcol{width:74px;height:196px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;z-index:1;background:transparent}
  .wcol::-webkit-scrollbar{display:none}
  .wcol b{display:block;height:40px;line-height:40px;text-align:center;font-family:var(--mono);font-size:15px;font-weight:700;color:var(--mut);scroll-snap-align:center;font-variant-numeric:tabular-nums;transition:color .15s}
  .wcol b.sel{color:var(--ink);font-weight:800}
  .wsp{display:block;height:78px;flex:none}

  /* 日历 */
  .cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-h b{font-size:15px;font-weight:800}
  .cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
  .cal-g .wd{font-size:12px;font-weight:800;color:var(--mut);padding:4px 0}
  .cd{height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;font-family:var(--mono);cursor:pointer;font-variant-numeric:tabular-nums;transition:.12s}
  .cd:active{transform:scale(.88)}
  .cd.dim{color:var(--mut);opacity:.4}
  .cd.tdy{box-shadow:inset 0 0 0 1.5px var(--coral);color:var(--coral)}
  .cd.sel{background:var(--coral);color:var(--surf)}

  .banner{display:flex;align-items:center;gap:8px;background:var(--dgr-soft);color:var(--dgr);border-radius:14px;padding:9px 12px;margin-bottom:6px;font-size:12px;font-weight:800}
  .grp{display:flex;align-items:center;padding:14px 2px 6px;font-size:12px;font-weight:800;color:var(--mut)}
  .grp .clr{margin-left:auto;color:var(--green);font-weight:800;font-size:12px;cursor:pointer}
  .toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) scale(.8);background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;padding:9px 16px;border-radius:999px;z-index:50;opacity:0;transition:.22s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) scale(1)}
  .empty{padding:20px 0;text-align:center;color:var(--mut);font-size:12px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="panel">
    <h1>小包子课表 · C 果冻色卡</h1>
    <p>可交互原型：功能与手机上的 1.23 完全一致，只是换了果冻色卡视觉。按钮/图标/动效做了精修——按压缩放、勾选打勾、完成划线、弹层回弹、滚轮选时间、日历选日期。</p>
    <div class="hint"><b>试试：</b>待办页加一条带时间区间的待办 → 回「今天」看它落到对应时段；点课程卡进详情记待办；整周点空格加课；设置里切深色；右上「第1周」改周次。</div>
    <div class="row">
      <button id="tlight" class="act">浅色</button>
      <button id="tdark">深色</button>
      <button id="tsys">跟随系统</button>
      <button id="reset">重置</button>
    </div>
  </div>

  <div class="device"><div class="screen" id="screen" data-theme="light">
    <div class="status"><span id="clock">9:41</span><span>5G ▮</span></div>
    <div class="view" id="view"></div>
    <div class="toast" id="toast"></div>
  </div></div>

<script>
const ICON={
  today:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9.5h18M8 2.5v3.5M16 2.5v3.5"/>',
  week:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 10h18M9 4v17M15 4v17"/>',
  todo:'<path d="M4 5.5h9M4 12h9M4 18.5h6"/><path d="M14.5 16.5l2.6 2.6L22 14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',
  share:'<path d="M12 3v11M8 7l4-4 4 4M5 20h14"/>',
  gear:'<circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 15H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 3.6V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  chevL:'<path d="M14.5 5.5L8 12l6.5 6.5"/>',
  chevR:'<path d="M9.5 5.5L16 12l-6.5 6.5"/>',
  arrL:'<path d="M14.5 5.5L8 12l6.5 6.5"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  alert:'<path d="M12 9v4M12 16.8h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  edit:'<path d="M4 20h4.5L20 8.5a2.1 2.1 0 0 0-3-3L5.5 17 4 20z"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
  trash:'<path d="M4 7h16M9.5 7V5a1.5 1.5 0 0 1 1.5-1.5h2A1.5 1.5 0 0 1 14.5 5v2M6.5 7l1 13h9l1-13"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>'
};
const svg=(p,cls)=>'<svg class="'+(cls||'ic')+'" viewBox="0 0 24 24">'+p+'</svg>';
const WD=['一','二','三','四','五','六','日'];
const TIMES=['8:10','9:00','9:55','10:45','11:35','13:30','14:20','15:15','16:05','17:50','18:40','19:30'];
const COLORS=['#F59E0B','#12A594','#E8590C','#4C7EF3','#9A6DE3','#E64980'];
const SLOTNAME={BREAKFAST:'🌅 早餐',MORNING:'☀️ 上午',LUNCH:'🍱 午餐',AFTERNOON:'🌤️ 下午',DINNER:'🍲 晚餐',EVENING:'🌙 晚间'};
const EMOJIS=['🥺','⚠️','🔥','📌','✏️','💡','✅','🍀'];
const DAY=86400000;
const T0=new Date();T0.setHours(0,0,0,0);
const T0MS=T0.getTime();

let uid=100;
function fresh(){return{
  theme:'light', screen:'today', day:3, week:1, fit:false,
  detailId:null, editing:null, dialog:null,
  c:{input:'',emoji:'',due:0,dm:-1,de:-1,type:'TODO'},
  m:{input:'',emoji:'',due:0,dm:-1,de:-1,type:'TODO'},
  courses:[
    {id:1,name:'综合英语3',loc:'3-205',teacher:'王老师',wd:3,s:3,e:4,cr:4,ok:true,wt:'WEEKLY',tmp:false,tw:0,ci:0},
    {id:2,name:'消费者行为分析',loc:'11-502',teacher:'',wd:3,s:6,e:7,cr:3,ok:true,wt:'WEEKLY',tmp:false,tw:0,ci:1},
    {id:3,name:'高等数学',loc:'5-101',teacher:'李老师',wd:5,s:3,e:4,cr:5,ok:true,wt:'WEEKLY',tmp:false,tw:0,ci:2},
    {id:4,name:'体育',loc:'操场',teacher:'赵老师',wd:2,s:6,e:7,cr:1,ok:true,wt:'WEEKLY',tmp:false,tw:0,ci:3},
    {id:5,name:'形势与政策',loc:'2-202',teacher:'张老师',wd:5,s:10,e:12,cr:0.5,ok:false,wt:'EVEN',tmp:false,tw:0,ci:4},
    {id:6,name:'补考',loc:'3-101',teacher:'',wd:7,s:1,e:2,cr:0,ok:true,wt:'WEEKLY',tmp:true,tw:1,ci:5}
  ],
  todos:[
    {id:90,t:'交策划案初稿',emoji:'✏️',due:0,dm:540,de:-1,done:true},
    {id:91,t:'小组展示排练',emoji:'📌',due:0,dm:930,de:990,done:false},
    {id:92,t:'取快递',emoji:'',due:0,dm:1020,de:-1,done:false},
    {id:93,t:'还图书馆过期书',emoji:'⚠️',due:-1,dm:-1,de:-1,done:false},
    {id:94,t:'交学费',emoji:'💰',due:1,dm:-1,de:-1,done:false}
  ],
  life:{'3|BREAKFAST':['一食堂'],'3|LUNCH':['外卖'],'3|DINNER':['二食堂']},
  notes:{'3|LUNCH':'校门口'}
};}
let S=fresh();
if(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches){S.theme='system';}

const slotOf=m=> m<0?null: m<490?'BREAKFAST': m<735?'MORNING': m<810?'LUNCH': m<1005?'AFTERNOON': m<1070?'DINNER':'EVENING';
const slotEmoji=k=>({BREAKFAST:'🌅',MORNING:'☀️',LUNCH:'🍱',AFTERNOON:'🌤️',DINNER:'🍲',EVENING:'🌙'})[k];
const slotLabel=k=>SLOTNAME[k].slice(2);
const wtName={WEEKLY:'每周',ODD:'单周',EVEN:'双周'};
function active(c){if(c.tmp)return c.tw===S.week;return c.wt==='ODD'?S.week%2===1:c.wt==='EVEN'?S.week%2===0:true;}
function expired(c){return c.tmp&&c.tw<S.week;}
function coursesOn(d){return S.courses.filter(c=>c.wd===d&&active(c)).sort((a,b)=>a.s-b.s);}
function pendingTodos(){return S.todos.filter(t=>!t.done);}
function overdueCount(){return pendingTodos().filter(t=>t.due<0).length;}
function dueLabel(d){if(d<0)return '逾期 '+(-d)+' 天';if(d===0)return '今天';if(d===1)return '明天';const dt=new Date(T0MS+d*DAY);return (dt.getMonth()+1)+'/'+dt.getDate();}
function fmt(m){if(m<0)return '';const h=Math.floor(m/60),mm=m%60;return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm;}
function rangeLabel(a,b){if(a<0)return '';if(b<0||b<=a)return fmt(a);return fmt(a)+'–'+fmt(b);}
function timeTag(t){if(t.dm<0)return '';return '<span class="pill '+(t.de>=0&&t.de>t.dm?'rg':'')+'">'+rangeLabel(t.dm,t.de)+'</span>';}
function dateTag(t){if(!t.due&&t.dm<0)return '';if(t.due===0&&t.dm>=0)return '';return '<span class="pill">'+(t.due===0?'今天':dueLabel(t.due))+'</span>';}
function credits(v,ok){const s=v%1===0?v.toFixed(0):v.toFixed(1);return s+(ok?'':'?')+' 学分';}
function getLife(d,s){return S.life[d+'|'+s]||[];}
function allPending(){return pendingTodos().length;}

function render(){
  const eff=S.theme==='system'?((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'):S.theme;
  document.getElementById('screen').setAttribute('data-theme',eff);
  document.getElementById('view').innerHTML=SCREEN();
}
function SCREEN(){
  switch(S.screen){
    case 'today':return todayView();
    case 'week':return weekView();
    case 'todo':return todoView();
    case 'detail':return detailView();
    case 'edit':return editView();
    case 'settings':return settingsView();
  }
  return todayView();
}
function topbar(title,sub,acts,lead){
  if(lead)return '<div class="top" style="align-items:center"><span class="backbtn" data-a="back">'+svg(ICON.arrL)+'返回</span><span class="sp"></span><span class="tb-a">'+(acts||'')+'</span></div>';
  return '<div class="top"><div><div class="tb-t"><span class="bun"></span>'+title+'</div>'+(sub?'<div class="tb-s">'+sub+'</div>':'')+'</div><div class="tb-a">'+(acts||'')+'</div></div>';
}
function nav(on){
  const n=allPending();
  const t=(k,l,i)=>'<div class="n'+(on===k?' on':'')+'" data-a="nav" data-v="'+k+'">'+svg(i)+l+(k==='todo'&&n?'<span class="cnt">'+n+'</span>':'')+'</div>';
  return '<div class="nav">'+t('today','今天',ICON.today)+t('week','整周',ICON.week)+t('todo','待办',ICON.todo)+'</div>';
}
function nowSlot(){const d=new Date();return slotOf(d.getHours()*60+d.getMinutes());}

/* ---------------- 今天 ---------------- */
function todayView(){
  const acts='<span class="pill" data-a="week">第'+S.week+'周</span>'+
    '<button class="ib" data-a="search">'+svg(ICON.search)+'</button>'+
    '<button class="ib" data-a="export">'+svg(ICON.share)+'</button>'+
    '<button class="ib" data-a="settings">'+svg(ICON.gear)+'</button>';
  const cs=coursesOn(S.day);
  const morning=cs.filter(c=>c.s<=5),afternoon=cs.filter(c=>c.s>=6&&c.s<=9),evening=cs.filter(c=>c.s>=10);
  const ns=nowSlot();
  const solo=S.todos.filter(t=>!t.done&&!t.cid);
  const inSlot=k=>solo.filter(t=>slotOf(t.dm)===k);
  const unscheduled=solo.filter(t=>t.dm<0);
  let b='<div class="body">';
  b+='<div class="datehead"><span class="d">周'+WD[S.day-1]+'</span><span class="s">第'+S.week+'周 · '+(cs.length?cs.length+' 门课':'今天没课')+'</span>'+
     '<span class="nav"><span class="chev" data-a="day" data-v="-1">'+svg(ICON.chevL,'')+'</span><span class="chev" data-a="day" data-v="1">'+svg(ICON.chevR,'')+'</span></span></div>';
  if(S.courses.length===0)b+=guideCard();
  if(unscheduled.length){b+='<div class="sec">🗒️ 待办 <span class="n">未安排时间</span><span class="ln"></span></div>'+unscheduled.map(t=>todoMini(t)).join('');}
  b+=mealCard('BREAKFAST')+slotTodos(inSlot('BREAKFAST'));
  b+='<div class="sec">☀️ 上午 <span class="n">'+(morning.length||'')+'</span><span class="ln"></span></div>';
  b+=morning.length?morning.map(c=>courseCard(c,ns==='MORNING')).join(''):freeCard('MORNING');
  b+=slotTodos(inSlot('MORNING'));
  b+=mealCard('LUNCH')+slotTodos(inSlot('LUNCH'));
  b+='<div class="sec">🌤️ 下午 <span class="n">'+(afternoon.length||'')+'</span><span class="ln"></span></div>';
  b+=afternoon.length?afternoon.map(c=>courseCard(c,ns==='AFTERNOON')).join(''):freeCard('AFTERNOON');
  b+=slotTodos(inSlot('AFTERNOON'));
  b+=mealCard('DINNER')+slotTodos(inSlot('DINNER'));
  b+='<div class="sec">🌙 晚间 <span class="n">'+(evening.length||'')+'</span><span class="ln"></span></div>';
  b+=evening.length?evening.map(c=>courseCard(c,ns==='EVENING')).join(''):freeCard('EVENING');
  b+=slotTodos(inSlot('EVENING'));
  b+='</div>';
  return topbar('小包子课表','第'+S.week+'周 · 6 门课 · 6.0 学分',acts)+b+nav('today')+'<div class="fab" data-a="add">'+svg(ICON.plus)+'</div>';
}
function guideCard(){return '<div class="jcard free"><div class="krow"><span class="typ">👋 欢迎来到小包子课表</span></div><div class="mt" style="color:var(--mut);font-family:var(--sans)">点右下角 ＋ 添加第一门课；点卡片进详情，能记待办和避坑小贴士。</div></div>';}
function mealCard(k){
  const ev=getLife(S.day,k);
  const opts={BREAKFAST:['代餐','一食堂','二食堂','不吃'],LUNCH:['外卖','一食堂','二食堂','不吃'],DINNER:['外卖','一食堂','二食堂','不吃']}[k];
  const note=k!=='BREAKFAST'&&ev.includes('外卖')?('<div class="mt" data-a="mealnote" data-v="'+k+'" style="cursor:pointer;color:var(--green);font-weight:700">🛵 取餐点：'+((S.notes[S.day+'|'+k]||'').replace(/</g,'&lt;')||'点击设置')+'</div>'):'';
  return '<div class="jcard meal"><div class="krow"><span class="typ">'+SLOTNAME[k]+(ev.length?' · <b style="color:var(--m-ink)">'+ev.join(' / ')+'</b>':' · 未设置')+'</span></div>'+
    '<div class="chips">'+opts.map(o=>'<span class="chip'+(ev.includes(o)?' on':'')+'" data-a="meal" data-v="'+k+'|'+o+'">'+o+'</span>').join('')+'</div>'+note+'</div>';
}
function freeCard(k){
  const ev=getLife(S.day,k);
  const opts={MORNING:['补觉','自习','休息'],AFTERNOON:['自习','跑步','自由'],EVENING:['图书馆自习','操场跑步','宿舍']}[k];
  return '<div class="jcard free"><div class="krow"><span class="typ">'+SLOTNAME[k]+' · 空课 / 没课</span><span class="sp"></span><span class="pill" data-a="addslot" data-v="'+k+'" style="cursor:pointer">＋ 添加课程</span></div>'+
    '<div class="chips">'+opts.map(o=>'<span class="chip'+(ev.includes(o)?' on':'')+'" data-a="meal" data-v="'+k+'|'+o+'">'+o+'</span>').join('')+'</div></div>';
}
function courseCard(c,now){
  const conf=S.courses.filter(o=>o.wd===c.wd&&o.id!==c.id&&o.s<=c.e&&o.e>=c.s&&active(o)).length>0;
  return '<div class="jcard course'+(now?' nowb':'')+'" data-a="open" data-id="'+c.id+'">'+
    '<div class="krow"><span class="typ">课程 · 第'+c.s+'-'+c.e+'节'+(c.tmp?(expired(c)?' · 已过期':' · 第'+c.tw+'周'):(c.wt!=='WEEKLY'?' · '+wtName[c.wt]:''))+'</span><span class="sp"></span>'+
    (now?'<span class="pill now"><i></i>现在</span>':(conf?'<span class="pill od">冲突</span>':''))+'</div>'+
    '<div class="nm">'+(conf?'⚠ ':'')+c.name+'</div>'+
    '<div class="mt">'+PeriodsTxt(c)+' · '+c.loc+(c.teacher?' · '+c.teacher:'')+' · '+credits(c.cr,c.ok)+'</div></div>';
}
function PeriodsTxt(c){return TIMES[c.s-1]+'–'+TIMES[c.e-1];}
function slotTodos(list){return list.length?('<div>'+list.map(t=>todoMini(t)).join('')+'</div>'):'';}
function todoMini(t){
  const tags=[t.emoji?'<span class="etag">'+t.emoji+'</span>':'',dateTag(t),timeTag(t)].filter(Boolean).join('');
  return '<div class="trow" data-a="ttoggle" data-id="'+t.id+'"><span class="cbx'+(t.done?' on':'')+'">'+svg(ICON.check,'')+'</span>'+
    '<div style="flex:1;min-width:0"><div class="tx">'+t.t+'</div>'+(tags?'<div class="sub" style="margin-top:4px">'+tags+'</div>':'')+'</div></div>';
}

/* ---------------- 整周 ---------------- */
function weekView(){
  const acts='<span class="pill" data-a="fit">'+(S.fit?'1:1':'适应整周')+'</span>';
  let head='<div class="wkhead">'+WD.map((w,i)=>'<span class="'+(i+1===S.day?'t':'')+'">'+w+'</span>').join('')+'</div>';
  let times='<div class="wktcol"><b></b>'+TIMES.map(t=>'<b>'+t+'</b>').join('')+'</div>';
  let cells='';
  for(let col=1;col<=7;col++)for(let p=1;p<=12;p++){
    cells+='<div class="cell'+(col===S.day?' tint':'')+'" style="grid-column:'+col+';grid-row:'+p+'" data-a="addcell" data-wd="'+col+'" data-p="'+p+'"><span class="pl">＋</span></div>';
  }
  let blocks='';
  S.courses.filter(c=>c.tmp||active(c)).forEach(c=>{
    const exp=expired(c);
    const conf=S.courses.filter(o=>o!==c&&o.wd===c.wd&&o.s<=c.e&&o.e>=c.s&&active(o)&&!o.tmp).length>0;
    const cls='blk'+(exp?' off':'');
    const bg=conf?'var(--dgr-soft)':'var(--wk'+c.ci+'a)';
    const fg=conf?'var(--dgr)':'var(--wk'+c.ci+'b)';
    const dot=conf?'var(--dgr)':COLORS[c.ci%6];
    blocks+='<div class="'+cls+'" style="grid-column:'+c.wd+';grid-row:'+c.s+'/span '+(c.e-c.s+1)+';background:'+bg+';color:'+fg+';border-color:transparent" data-a="open" data-id="'+c.id+'">'+
      '<span style="position:absolute;left:5px;top:6px;width:5px;height:5px;border-radius:50%;background:'+(exp?'var(--mut)':dot)+'"></span>'+
      (conf?'⚠冲突':c.name)+'<small>'+c.loc+(c.tmp?(exp?'·过期':'·第'+c.tw+'周'):(c.wt!=='WEEKLY'?'·'+wtName[c.wt]:''))+'</small></div>';
  });
  return topbar('整周','第'+S.week+'周 · 周'+WD[S.day-1]+'为今天',acts)+
    '<div class="wk'+(S.fit?' fit':'')+'"><div class="wkmain">'+times+'<div class="wkscroll">'+head+'<div class="wkgrid">'+cells+blocks+'</div></div></div></div>'+nav('week');
}

/* ---------------- 待办 ---------------- */
function todoView(){
  const acts='<button class="ib" data-a="ctodo">'+svg(ICON.plus)+'</button>';
  const pend=S.todos.filter(t=>!t.done),done=S.todos.filter(t=>t.done);
  const od=overdueCount();
  let b='<div class="body">';
  b+='<div class="jcard" style="background:var(--surf);cursor:default"><input id="todoinput" class="fin" style="margin:0" placeholder="记一件小事…">'+
     '<div class="tools" style="display:flex;align-items:center;gap:4px;margin-top:9px;flex-wrap:wrap">'+
     '<span class="chip'+(S.c.due!==0?' set':'')+'" data-a="cdate">📅 '+(S.c.due===0?'日期':dueLabel(S.c.due))+'</span>'+
     '<span class="chip'+(S.c.dm>=0?' set':'')+'" data-a="ctime">🕐 '+(S.c.dm<0?'时间':fmt(S.c.dm))+'</span>'+
     (S.c.dm>=0?'<span class="chip'+(S.c.de>=0?' set':'')+'" data-a="cend">'+(S.c.de<0?'＋结束':'– '+fmt(S.c.de))+'</span>':'')+
     '<span class="chip'+(S.c.emoji?' set':'')+'" data-a="cemoji">'+(S.c.emoji||'😀')+'</span>'+
     '<span class="add" data-a="cadd" style="margin-left:auto;font-size:12px;font-weight:800;background:var(--coral);color:var(--surf);border-radius:999px;padding:5px 13px;cursor:pointer">添加</span></div></div>';
  if(od)b+='<div class="banner">'+svg(ICON.alert,'')+' '+od+' 件已逾期</div>';
  b+='<div class="sec">未完成 <span class="n">'+pend.length+'</span><span class="ln"></span></div>';
  b+=pend.length?pend.map(t=>todoRow(t)).join(''):'<div class="empty">没有待办，轻松 🎉</div>';
  if(done.length){b+='<div class="grp">已完成 · '+done.length+'<span class="clr" data-a="cleardone">清空</span></div>'+done.map(t=>todoRow(t)).join('');}
  b+='</div>';
  return topbar('待办','未完成 '+allPending()+' · 逾期 '+od,acts)+b+nav('todo');
}
function todoRow(t){
  const sub=[t.due!==0||t.dm<0?dateTag(t):'',timeTag(t)].filter(Boolean).join('');
  const cname=t.cid?(S.courses.find(x=>x.id===t.cid)||{}).name:null;
  return '<div class="trow'+(t.done?' done':'')+(t.due<0&&!t.done?' redb':'')+'" data-a="ttoggle" data-id="'+t.id+'">'+

/* ---------------- 弹窗 ---------------- */
function dialog(){
  const d=S.dialog;if(!d)return '';
  const wrap=(inner,align)=>'<div class="scrim" data-a="dclose" style="align-items:'+(align||'flex-end')+'"><div class="sheet"'+(align==='center'?' style="border-radius:24px;margin:0 20px"':'')+'>'+inner+'</div></div>';
  if(d.type==='week')return wrap('<div class="dlg-t">当前周次</div><div class="stepper"><span class="b" data-a="wkm">−</span><span class="v">第 '+S.week+' 周</span><span class="b" data-a="wkp">＋</span></div><div class="dlg-a"><b class="p" data-a="dclose">完成</b></div>','center');
  if(d.type==='del')return wrap('<div class="dlg-t">删除这门课？</div><div class="dlg-b">课程和它的备忘会一起删除，无法恢复。</div><div class="dlg-a"><b class="g" data-a="dclose">取消</b><b class="p" style="background:var(--dgr)" data-a="dodel">删除</b></div>','center');
  if(d.type==='cleardone')return wrap('<div class="dlg-t">清空已完成？</div><div class="dlg-b">将删除所有已完成的待办。</div><div class="dlg-a"><b class="g" data-a="dclose">取消</b><b class="p" data-a="doclear">清空</b></div>','center');
  if(d.type==='conflict')return wrap('<div class="dlg-t">时间冲突</div><div class="dlg-b">周'+WD[S.ed.wd-1]+' 第'+S.ed.s+'-'+S.ed.e+'节已有别的课，仍要保存吗？</div><div class="dlg-a"><b class="g" data-a="dclose">返回修改</b><b class="p" data-a="dforce">仍要保存</b></div>','center');
  if(d.type==='search'){
    return '<div class="scrim" data-a="dclose" style="align-items:flex-start"><div class="sheet" style="border-radius:0 0 24px 24px">'+
      '<div class="dlg-t" style="margin-bottom:10px">搜索课程</div><input class="fin" id="q" placeholder="课程名 / 老师 / 教室" oninput="searchNow(this.value)"><div id="sres" style="margin-top:10px"></div></div></div>';
  }
  if(d.type==='time'){
    const v=d.cur>=0?d.cur:12*60;
    const hrs=Array.from({length:24},(_,i)=>i),mins=Array.from({length:60},(_,i)=>i);
    const col=(arr)=>'<div class="wcol" id="'+(arr===hrs?'wh':'wm')+'"><i class="wsp"></i>'+arr.map(x=>'<b data-v="'+x+'">'+(x<10?'0':'')+x+'</b>').join('')+'<i class="wsp"></i></div>';
    return wrap('<div class="dlg-t">'+(d.target==='end'?'选择结束时间':'选择开始时间')+'</div>'+
      '<div class="wheelwrap">'+col(hrs)+col(mins)+'</div>'+
      '<div class="dlg-a"><b class="g" data-a="dclose">取消</b><b class="p" data-a="wheelok">确定</b></div>');
  }
  if(d.type==='cal'){
    const y=d.y,m=d.m;
    const first=new Date(y,m,1);const startWd=(first.getDay()+6)%7;
    const dim=new Date(y,m+1,0).getDate();
    const today=new Date();today.setHours(0,0,0,0);
    let cells='';
    for(let i=0;i<startWd;i++)cells+='<span></span>';
    for(let day=1;day<=dim;day++){
      const ddate=new Date(y,m,day);const off=Math.round((ddate-today)/DAY);
      const isT=off===0;
      const isSel=d.back? (S.m.due===off) : (S.c.due===off);
      cells+='<span class="cd'+(isT?' tdy':'')+(isSel?' sel':'')+'" data-a="calsel" data-v="'+off+'">'+day+'</span>';
    }
    return wrap('<div class="cal-h"><span class="chev" data-a="calprev">'+svg(ICON.chevL,'')+'</span><b>'+y+' 年 '+(m+1)+' 月</b><span class="chev" data-a="calnext">'+svg(ICON.chevR,'')+'</span></div>'+
      '<div class="cal-g">'+['一','二','三','四','五','六','日'].map(w=>'<span class="wd">'+w+'</span>').join('')+cells+'</div>'+
      '<div class="dlg-a"><b class="g" data-a="calclear">清除日期</b><b class="p" data-a="dclose">完成</b></div>');
  }
  return '';
}
function mount(){
  render();
  const sc=document.getElementById('screen');
  const old=sc.querySelector('.scrim');if(old)old.remove();
  if(S.dialog)sc.insertAdjacentHTML('beforeend',dialog());
  if(S.dialog&&S.dialog.type==='time'){
    requestAnimationFrame(()=>{
      const wh=document.getElementById('wh'),wm=document.getElementById('wm');
      const v=S.dialog.cur>=0?S.dialog.cur:720;
      if(wh)wh.scrollTop=(Math.floor(v/60))*40-78;
      if(wm)wm.scrollTop=(v%60)*40-78;
      [wh,wm].forEach(c=>{if(!c)return;const f=()=>{const i=Math.round(c.scrollTop/40);c.querySelectorAll('b').forEach((b,j)=>b.classList.toggle('sel',j===i));};c.addEventListener('scroll',f,{passive:true});f();});
    });
  }
  if(S.dialog&&S.dialog.type==='search'){const q=document.getElementById('q');if(q){q.focus();searchNow(q.value);}}
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);}
function openEdit(o){
  if(o.id!=null){const c=S.courses.find(x=>x.id===o.id);S.editing=Object.assign({},c,{id:o.mode==='copy'?null:c.id,mode:o.mode,tw:c.tw||S.week});}
  else S.editing={mode:'new',id:null,name:'',loc:'',teacher:'',wd:o.wd||S.day,s:o.s||1,e:o.e||2,cr:3,ok:true,wt:'WEEKLY',tmp:false,tw:S.week,ci:0};
  S.screen='edit';mount();
}
function grabFields(){const g=id=>{const el=document.getElementById(id);return el?el.value:undefined;};
  const e=S.editing;if(!e)return;const n=g('f_name');if(n!==undefined)e.name=n;const l=g('f_loc');if(l!==undefined)e.loc=l;const t=g('f_teacher');if(t!==undefined)e.teacher=t;}
function trySave(){grabFields();const e=S.editing;if(!e.name.trim()){toast('课程名不能为空');return;}
  const conf=S.courses.filter(c=>c.id!==e.id&&c.wd===e.wd&&c.s<=e.e&&c.e>=e.s&&!c.tmp);
  if(conf.length){S.dialog={type:'conflict'};mount();return;}
  doSave();}
function doSave(){const e=S.editing;
  if(e.id==null){const c=Object.assign({},e,{id:++uid});delete c.mode;S.courses.push(c);}
  else{const c=S.courses.find(x=>x.id===e.id);Object.assign(c,{name:e.name,loc:e.loc,teacher:e.teacher,wd:e.wd,s:e.s,e:e.e,cr:e.cr,ok:e.ok,wt:e.wt,tmp:e.tmp,tw:e.tw,ci:e.ci});}
  S.editing=null;
  // 保存后回到进入编辑前的那一页（从详情进来就回详情）
  if(S._from==='detail'&&S.detailId){S.screen='detail';S._from=S._detailFrom||'today';}
  else S.screen='today';
  mount();}
window.searchNow=function(q){const box=document.getElementById('sres');if(!box)return;
  const r=S.courses.filter(c=>!q||(c.name+c.teacher+c.loc).toLowerCase().includes(q.toLowerCase()));
  box.innerHTML=r.length?r.map(c=>'<div class="trow" style="cursor:pointer" data-a="open" data-id="'+c.id+'"><div style="flex:1"><div class="tx">'+c.name+'</div><div class="sub">周'+WD[c.wd-1]+' · '+c.loc+'</div></div></div>').join(''):'<div class="empty">没找到相关课程</div>';};
function exportText(){
  let s='小包子课表（第 '+S.week+' 周）\n';
  for(let w=1;w<=7;w++){const cs=S.courses.filter(c=>c.wd===w&&active(c));if(!cs.length)continue;
    s+='\n周'+WD[w-1]+'\n';cs.forEach(c=>{s+='  '+TIMES[c.s-1]+'–'+TIMES[c.e-1]+' '+c.name+' @ '+c.loc+'\n';});}
  s+='\n待办\n';S.todos.filter(t=>!t.done).forEach(t=>{s+='  ☐ '+t.t+(t.dm>=0?' '+rangeLabel(t.dm,t.de):'')+'\n';});
  if(navigator.clipboard)navigator.clipboard.writeText(s).catch(()=>{});
  toast('课表已复制，可粘贴分享');
}
document.getElementById('screen').addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,v=el.dataset.v,id=+el.dataset.id;
  switch(a){
    case 'nav':S.screen=v;S.dialog=null;mount();break;
    case 'day':S.day=((S.day-1+(+v)+7)%7)+1;mount();break;
    case 'open':if(S.screen!=='detail')S._from=(S.screen==='week'?'week':'today');S.detailId=id;S.screen='detail';mount();break;
    case 'settings':S._from='today';S.screen='settings';mount();break;
    case 'back':S.screen=S._from||'today';S.editing=null;mount();break;
    case 'week':S.dialog={type:'week'};mount();break;
    case 'wkm':S.week=Math.max(1,S.week-1);mount();break;
    case 'wkp':S.week=Math.min(30,S.week+1);mount();break;
    case 'fit':S.fit=!S.fit;mount();break;
    case 'search':S.dialog={type:'search'};mount();break;
    case 'export':exportText();break;
    case 'add':S._from='today';openEdit({mode:'new'});break;
    case 'addslot':S._from='today';openEdit({mode:'new',wd:S.day,s:1,e:2});break;
    case 'addcell':S._from='week';openEdit({mode:'new',wd:+el.dataset.wd,s:+el.dataset.p,e:+el.dataset.p});break;
    case 'edit':S._detailFrom=S._from||'today';S._from='detail';openEdit({mode:'edit',id:id});break;
    case 'copy':S._detailFrom=S._from||'today';S._from='detail';openEdit({mode:'copy',id:id});break;
    case 'meal':{const[k,o]=v.split('|');const cur=getLife(S.day,k);const nx=cur.includes(o)?cur.filter(x=>x!==o):(cur.length>=3?(toast('最多选 3 个哦'),cur):cur.concat(o));S.life[S.day+'|'+k]=nx;mount();break;}
    case 'mealclr':S.life[S.day+'|'+v]=[];mount();break;
    case 'mealnote':{const k=v;const cur=S.notes[S.day+'|'+k]||'';const r=prompt('取餐点：',cur);if(r!==null){S.notes[S.day+'|'+k]=r;mount();}break;}
    case 'ttoggle':{const t=S.todos.find(x=>x.id===id);t.done=!t.done;mount();break;}
    case 'ttoggle2':{const t=S.todos.find(x=>x.id===id);t.done=!t.done;mount();break;}
    case 'tdel':S.todos=S.todos.filter(x=>x.id!==id);mount();break;
    case 'mdel':S.todos=S.todos.filter(x=>x.id!==id);mount();break;
    case 'ctodo':S.c={input:'',emoji:'',due:0,dm:-1,de:-1,type:'TODO'};S.screen='todo';mount();break;
    case 'cdate':S.dialog={type:'cal',back:false,y:new Date().getFullYear(),m:new Date().getMonth()};mount();break;
    case 'ctime':S.dialog={type:'time',target:'start',cur:S.c.dm};mount();break;
    case 'cend':S.dialog={type:'time',target:'end',cur:S.c.de>=0?S.c.de:S.c.dm};mount();break;
    case 'cemoji':{const i=EMOJIS.indexOf(S.c.emoji);S.c.emoji=EMOJIS[(i+1)%EMOJIS.length];if(!S.c.emoji)S.c.emoji=EMOJIS[0];mount();break;}
    case 'cadd':{const inp=document.getElementById('todoinput');const t=inp?inp.value.trim():'';if(!t){toast('先写点什么');break;}
      S.todos.unshift({id:++uid,t,emoji:S.c.emoji,due:S.c.due,dm:S.c.dm,de:S.c.de,done:false});
      S.c={input:'',emoji:'',due:0,dm:-1,de:-1,type:'TODO'};mount();break;}
    case 'cleardone':S.dialog={type:'cleardone'};mount();break;
    case 'doclear':S.todos=S.todos.filter(t=>!t.done);S.dialog=null;mount();break;
    case 'mtype':S.m.type=v;mount();break;
    case 'mdate':S.dialog={type:'cal',back:true,y:new Date().getFullYear(),m:new Date().getMonth()};mount();break;
    case 'mtime':S.dialog={type:'time',target:'start',cur:S.m.dm};mount();break;
    case 'mend':S.dialog={type:'time',target:'end',cur:S.m.de>=0?S.m.de:S.m.dm};mount();break;
    case 'memoji':S.m.emoji=S.m.emoji===v?'':v;mount();break;
    case 'madd':{const inp=document.getElementById('memoinput');const t=inp?inp.value.trim():'';if(!t){toast('先写点什么');break;}
      S.todos.push({id:++uid,t,emoji:S.m.type==='TODO'?S.m.emoji:(S.m.emoji||'💡'),type:S.m.type,cid:S.detailId,due:S.m.due,dm:S.m.type==='TODO'?S.m.dm:-1,de:S.m.type==='TODO'?S.m.de:-1,done:false});
      S.m={input:'',emoji:'',due:0,dm:-1,de:-1,type:S.m.type};mount();break;}
    case 'ewd':S.editing.wd=+v;mount();break;
    case 'es':S.editing.s=+v;if(S.editing.e<S.editing.s)S.editing.e=S.editing.s;mount();break;
    case 'ee':S.editing.e=Math.max(+v,S.editing.s);mount();break;
    case 'ecr':S.editing.cr=+v;S.editing.ok=true;mount();break;
    case 'eok':S.editing.ok=!S.editing.ok;mount();break;
    case 'ewt':S.editing.wt=v;mount();break;
    case 'etmp':S.editing.tmp=!S.editing.tmp;if(S.editing.tmp)S.editing.tw=S.week;mount();break;
    case 'etwm':S.editing.tw=Math.max(1,S.editing.tw-1);mount();break;
    case 'etwp':S.editing.tw=Math.min(30,S.editing.tw+1);mount();break;
    case 'eci':S.editing.ci=+v;mount();break;
    case 'save':trySave();break;
    case 'delask':S.dialog={type:'del',id:S.editing.id};mount();break;
    case 'dodel':S.courses=S.courses.filter(x=>x.id!==S.dialog.id);S.dialog=null;S.editing=null;S.screen='today';mount();break;
    case 'dforce':S.dialog=null;doSave();break;
    case 'dclose':S.dialog=null;mount();break;
    case 'theme':S.theme=v;mount();syncPanel();break;
    case 'calprev':S.dialog.m--;if(S.dialog.m<0){S.dialog.m=11;S.dialog.y--;}mount();break;
    case 'calnext':S.dialog.m++;if(S.dialog.m>11){S.dialog.m=0;S.dialog.y++;}mount();break;
    case 'calclear':if(S.dialog.back)S.m.due=0;else S.c.due=0;S.dialog=null;mount();break;
    case 'calsel':{const off=+v;if(S.dialog.back)S.m.due=off;else S.c.due=off;S.dialog=null;mount();break;}
    case 'wheelok':{
      const wh=document.getElementById('wh'),wm=document.getElementById('wm');
      const h=Math.round(wh.scrollTop/40),mi=Math.round(wm.scrollTop/40);
      const picked=h*60+mi;
      if(S.dialog.target==='end'){S.c.de=Math.max(picked,S.c.dm);S.m.de=Math.max(picked,S.m.dm);}
      else{S.c.dm=picked;if(S.c.de>=0&&S.c.de<picked)S.c.de=-1;S.m.dm=picked;if(S.m.de>=0&&S.m.de<picked)S.m.de=-1;}
      S.dialog=null;mount();break;}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='f_name')S.editing.name=e.target.value;
  if(e.target.id==='f_loc')S.editing.loc=e.target.value;
  if(e.target.id==='f_teacher')S.editing.teacher=e.target.value;
});
function syncPanel(){
  document.getElementById('tlight').classList.toggle('act',S.theme==='light');
  document.getElementById('tdark').classList.toggle('act',S.theme==='dark');
  document.getElementById('tsys').classList.toggle('act',S.theme==='system');
}
document.getElementById('tlight').onclick=()=>{S.theme='light';mount();syncPanel();};
document.getElementById('tdark').onclick=()=>{S.theme='dark';mount();syncPanel();};
document.getElementById('tsys').onclick=()=>{S.theme='system';mount();syncPanel();};
document.getElementById('reset').onclick=()=>{const t=S.theme;S=fresh();S.theme=t;mount();};
setInterval(()=>{const d=new Date();document.getElementById('clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');},1000);
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='system')mount();});
syncPanel();
mount();
</script>
</body>
</html>
